info:
  version: 1.0.7
  description: SMF initial local configuration

configuration:
  smfName: SMF1

  sbi:
    scheme: http
    registerIPv4: 127.0.0.2
    bindingIPv4: 127.0.0.2
    port: 8000
    tls:
      key: cert/smf.key
      pem: cert/smf.pem

  serviceNameList:
  - nsmf-pdusession
  - nsmf-event-exposure
  - nsmf-oam
  - nsmf-callback

  snssaiInfos:
  - sNssai:
      sst: 1
      sd: '010203'
    dnnInfos:
    - dnn: internet
      dns:
        ipv4: 8.8.8.8
        ipv6: 2001:4860:4860::8888
  - sNssai:
      sst: 1
      sd: '112233'
    dnnInfos:
    - dnn: internet
      dns:
        ipv4: 8.8.8.8
        ipv6: 2001:4860:4860::8888
  - sNssai:
      sst: 2
      sd: '020202'
    dnnInfos:
    - dnn: internet
      dns:
        ipv4: 8.8.8.8

  plmnList:
  - mcc: 208
    mnc: 93
#  locality: pool-embb

  pfcp:
    nodeID: 10.200.1.1
    listenAddr: 10.200.1.1
    externalAddr: 10.200.1.1
    assocFailAlertInterval: 10s
    assocFailRetryInterval: 30s
    heartbeatInterval: 10s

  userplaneInformation:
    upNodes:
      gNB1:
        type: AN
      UPF1:
        type: UPF
        nodeID: 10.200.1.2
        addr: 10.200.1.2
        sNssaiUpfInfos:
        - sNssai:
            sst: 1
            sd: '010203'
          dnnUpfInfoList:
          - dnn: internet
            pools:
            - cidr: 10.60.0.0/16
        - sNssai:
            sst: 1
            sd: '112233'
          dnnUpfInfoList:
          - dnn: internet
            pools:
            - cidr: 10.61.0.0/16
        interfaces:
        - interfaceType: N3
          endpoints:
          - 10.200.1.2
          networkInstances:
          - internet
      UPF2:
        type: UPF
        nodeID: 10.200.2.2
        addr: 10.200.2.2
        sNssaiUpfInfos:
        - sNssai:
            sst: 2
            sd: '020202'
          dnnUpfInfoList:
          - dnn: internet
            pools:
            - cidr: 10.62.0.0/16
        - sNssai:
            sst: 1
            sd: '010203'
          dnnUpfInfoList:
          - dnn: internet
            pools:
            - cidr: 10.200.0.0/16
        interfaces:
        - interfaceType: N3
          endpoints:
          - 10.200.2.2
          networkInstances:
          - internet
    links:
    - A: gNB1
      B: UPF1
    - A: gNB1
      B: UPF2

  t3591:
    enable: true
    expireTime: 16s
    maxRetryTimes: 3
  t3592:
    enable: true
    expireTime: 16s
    maxRetryTimes: 3

  nrfUri: http://127.0.0.10:8000
  nrfCertPem: cert/nrf.pem
  urrPeriod: 30
  urrThreshold: 500000
  requestedUnit: 1000

logger:
  enable: true
  level: info
  reportCaller: false
