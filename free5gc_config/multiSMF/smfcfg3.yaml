info:
  version: 1.0.7
  description: SMF3 local configuration (Disjoint SMF Set)

configuration:
  smfName: SMF3
  sbi:
    scheme: http
    registerIPv4: 127.0.0.32
    bindingIPv4: 127.0.0.32
    port: 8000
    tls:
      key: cert/smf.key
      pem: cert/smf.pem

  serviceNameList:
  - nsmf-pdusession
  - nsmf-event-exposure
  - nsmf-oam
  - nsmf-callback

  snssaiInfos:
  - sNssai:
      sst: 5
      sd: '050505'
    dnnInfos:
    - dnn: internet
      dns:
        ipv4: 8.8.8.8

  - sNssai:
      sst: 1
      sd: '010203'
    dnnInfos:
    - dnn: internet
      dns:
        ipv4: 8.8.8.8
  plmnList:
  - mcc: 208
    mnc: 93
#  locality: pool-urllc

  pfcp:
    nodeID: 10.200.3.1
    listenAddr: 10.200.3.1
    externalAddr: 10.200.3.1
    assocFailAlertInterval: 10s
    assocFailRetryInterval: 30s
    heartbeatInterval: 10s

  userplaneInformation:
    upNodes:
      gNB2:
        type: AN
      UPF3:
        type: UPF
        nodeID: 10.200.3.2
        addr: 10.200.3.2
        sNssaiUpfInfos:
        - sNssai:
            sst: 5
            sd: '050505'
          dnnUpfInfoList:
          - dnn: internet
            pools:
            - cidr: 10.65.0.0/16
        - sNssai:
            sst: 1
            sd: '010203'
          dnnUpfInfoList:
          - dnn: internet
            pools:
            - cidr: 10.200.0.0/16
        interfaces:
        - interfaceType: N3
          endpoints:
          - 10.200.3.2
          networkInstances:
          - internet
    links:
    - A: gNB2
      B: UPF3

  t3591:
    enable: true
    expireTime: 16s
    maxRetryTimes: 3
  t3592:
    enable: true
    expireTime: 16s
    maxRetryTimes: 3

  nrfUri: http://127.0.0.10:8000
  nrfCertPem: cert/nrf.pem
  urrPeriod: 30
  urrThreshold: 500000
  requestedUnit: 1000

logger:
  enable: true
  level: info
  reportCaller: false
